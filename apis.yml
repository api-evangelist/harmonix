aid: harmonix
name: Harmonix
description: 'Harmonix Music Systems is one of the world''s leading independent game development
  studios, best known for creating blockbuster music and rhythm franchises including Rock Band and
  Dance Central, alongside titles such as Amplitude, Fuser, DropMix, Audica, Super Beat Sports, and
  Harmonix Music VR. Founded in 1995 and based in Cambridge, Massachusetts, the studio was acquired
  by Epic Games in 2021 and continues to invent the future of music and motion gaming. Harmonix
  operates a consumer-facing web presence (games, music, community, blog, and press) and publishes no
  public developer API, SDK, or documentation surface at this time.'
